[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge"
version = "0.1.0"
description = "아맘때 '상담 브리지' PoC"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11,<2",
    "jsonschema>=4.23",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
